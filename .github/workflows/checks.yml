name: Release checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CINEMAGIC_PROVIDERS: cinesrc,vidlink,vidsrc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/export_static.py
      - name: Check browser script syntax
        run: for file in frontend/*.js; do node --check "$file"; done
      - name: Check static playback policy
        run: node -e "const p=require('./frontend/providers.js'); if(p.list().length!==3)process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: cinemagic-release-candidate
          path: frontend/
